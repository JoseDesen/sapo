					headers: {
						'Content-Type': 'application/json',
					},
					body: JSON.stringify({ nome, pontuacao }),
				});
				const data = await response.json();
				console.log('Resposta do servidor:', data);
				if (!response.ok) {
					throw new Error(`Erro: ${response.statusText}`);
				}
				exibirMelhoresPontuacaos();
			} catch (error) {
				console.error('Erro ao adicionar pontuacao:', error);
			}
		}

<div class="modal-overlay" id="tutorialModal">
    <div class="modal-tutorial">
        <button class="modal-close" onclick="fecharTutorial()">✖</button>
        <div class="modal-content" id="tutorialConteudo">
            </div>
        <div class="modal-footer">
            <button id="btnProximo" onclick="proximoPasso()">Próximo</button>
        </div>

</div>

	<script>
	//parte do codigo que faz o touch-screen
		let startX, startY;

		gameArea.addEventListener('touchstart', function(event) {
			const touch = event.touches[0];
			startX = touch.clientX;
			startY = touch.clientY;
		}, false);

		gameArea.addEventListener('touchmove', function(event) {
			event.preventDefault(); // Evita o scroll da página
		}, false);

		gameArea.addEventListener('touchend', function(event) {
			const touch = event.changedTouches[0];
			const endX = touch.clientX;
			const endY = touch.clientY;

			const diffX = endX - startX;
			const diffY = endY - startY;

			if (Math.abs(diffX) > Math.abs(diffY)) {
				// Movimento horizontal
				if (diffX > 0) {
					// Swipe para a direita
					direcao(3);
					console.log('direita');
				} else {
					// Swipe para a esquerda
					direcao(1);					
					console.log('esquerda');
				}
			} else {
				// Movimento vertical
				if (diffY < 0) {
					// Swipe para cima
					direcao(2);
					console.log('cima');
				} else {
					// Swipe para baixo
				}
			}
		}, false);

		
    // Pega todos os elementos  do modal de configurações
    var modal = document.getElementById("myModal");
    var btn = document.getElementById("btnModal");
    var span = document.getElementsByClassName("close")[0];

    // Quando o usuário clicar no botão, abre a janela modal
    btn.onclick = function() {
        modal.style.display = "block";
    }

    // Quando o usuário clicar no "x", fecha a janela modal
    span.onclick = function() {
        modal.style.display = "none";
    }
		// Lógica do tutorial
		const passos = [
			`<h2>Como Jogar</h2>
			<p>Bem-vindo ao Jogo do Sapo! Sua missão é guiar o sapo pulando para a vitória-régia correta antes que o tempo acabe.</p>`,
			`<h2>Controles no Celular</h2>
			<p><ul>
				<li><em>Botões Virtuais:</em>
				<ul>
					<li>Toque em <span class="btn-tutorial btn-outline">FRENTE</span> quando a vitória-régia estiver à frente.</li>
					<li>Toque em <span class="btn-tutorial btn-outline">DIREITA</span> quando estiver à direita.</li>
					<li>Toque em <span class="btn-tutorial btn-outline">ESQUERDA</span> quando estiver à esquerda.</li>
				</ul>
				</li>
				<li style="margin-top:8px"><em>Gestos (Deslizar o Dedo):</em>
				<ul>
					<li>Ative a área de toque com o botão <strong>Ativar/Desativar Touch Screen</strong>.</li>
					<li>Deslize <strong>para cima</strong> → pular para frente.</li>
					<li>Deslize <strong>para a direita</strong> → pular para a direita.</li>
					<li>Deslize <strong>para a esquerda</strong> → pular para a esquerda.</li>
				</ul>
				</li>
			</ul>`,
			`<h2>Controles no Computador</h2>
			<p>
				<ul>
					<li><span class="kbd">↑</span> ou <span class="kbd">W</span> — pular para frente.</li>
					<li><span class="kbd">→</span> ou <span class="kbd">D</span> — pular para a direita.</li>
					<li><span class="kbd">←</span> ou <span class="kbd">A</span> — pular para a esquerda.</li>
				</ul>
			</p>`,
			`<h2>Regras</h2>
			<p>Ganhe 1 ponto por acerto. A cada 10 pontos, +5 segundos no tempo. O jogo acaba se errar ou o tempo zerar.</p>`
		];

		let passoAtual = 0;

		function mostrarPasso() {
			document.getElementById("tutorialConteudo").innerHTML = passos[passoAtual];
			document.getElementById("btnProximo").textContent = 
			passoAtual === passos.length - 1 ? "Começar" : "Próximo";
		}

		function proximoPasso() {
			if (passoAtual < passos.length - 1) {
				passoAtual++;
				mostrarPasso();
			} else {
				fecharTutorial();
			}
		}

		function fecharTutorial() {
			document.getElementById("tutorialModal").style.display = "none";
			iniciar(); // Inicia o jogo após fechar o tutorial
		}

		// Mostra o primeiro passo ao carregar
		mostrarPasso();
	</script>

	</body>
