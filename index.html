					},
					body: JSON.stringify({ nome, pontuacao }),
				});
				const data = await response.json();

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      document.getElementById("output").textContent = "Navegador não suporta reconhecimento de voz";
    } else {
      const rec = new SpeechRecognition();
      rec.lang = "pt-BR";
      rec.continuous = true; // Mantém ouvindo

      document.getElementById("startVoice").addEventListener("click", () => {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(() => {
            rec.start();
            document.getElementById("output").textContent = "🎙 Ouvindo...";
          })
          .catch(err => {
            document.getElementById("output").textContent = "Permissão negada: " + err;
          });
      });

      rec.interimResults = true;
      rec.addEventListener("result", e => {
        const texto = e.results[e.results.length - 1][0].transcript.toLowerCase().trim();
        document.getElementById("output").textContent = "Você disse: " + texto;
        console.log("Parcial:", texto);
  
        if (texto.includes("esquerda")) direcao(1);
        if (texto.includes("frente")) direcao(2);
        if (texto.includes("direita")) direcao(3);
      });

      rec.addEventListener("error", e => {
        console.error("Erro:", e.error);
        document.getElementById("output").textContent = "Erro: " + e.error;
      });

      rec.addEventListener("end", () => {
        console.log("Reconhecimento encerrado");
        alert("Reconhecimento encerrado")
      });

	<script>
	//parte do codigo que faz o touch-screen
		let startX, startY;

		gameArea.addEventListener('touchstart', function(event) {
			const touch = event.touches[0];
			startX = touch.clientX;
			startY = touch.clientY;
		}, false);

		gameArea.addEventListener('touchmove', function(event) {
			event.preventDefault(); // Evita o scroll da página
		}, false);

		gameArea.addEventListener('touchend', function(event) {
			const touch = event.changedTouches[0];
			const endX = touch.clientX;
			const endY = touch.clientY;

			const diffX = endX - startX;
			const diffY = endY - startY;

			if (Math.abs(diffX) > Math.abs(diffY)) {
				// Movimento horizontal
				if (diffX > 0) {
					// Swipe para a direita
					direcao(3);
					console.log('direita');
				} else {
					// Swipe para a esquerda
					direcao(1);					
					console.log('esquerda');
				}
			} else {
				// Movimento vertical
				if (diffY < 0) {
					// Swipe para cima
					direcao(2);
					console.log('cima');
				} else {
					// Swipe para baixo
				}
			}
		}, false);

		
    // Pega todos os elementos  do modal
    var modal = document.getElementById("myModal");
    var btn = document.getElementById("btnModal");
    var span = document.getElementsByClassName("close")[0];

    // Quando o usuário clicar no botão, abre a janela modal
    btn.onclick = function() {
        modal.style.display = "block";
    }

    // Quando o usuário clicar no "x", fecha a janela modal
    span.onclick = function() {
        modal.style.display = "none";
    }

	</script>

	</body>
